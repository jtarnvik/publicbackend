# Deployed configuration (Mac Mini). Activated by deployment/start-publicbackend.sh.
#
# This file is TRACKED in git and must never hold secrets — those stay in
# deployment/publicbackend.env on the deploy machine and reach the app as environment
# variables, resolving the ${...} placeholders in application.properties.
#
# The profile exists so that deployment-only behaviour can be gated POSITIVELY —
# @Profile("production") and <springProfile name="production"> — rather than by a negation
# list that has to be extended every time a development profile is added. `local` and
# `travel` are development profiles, `test` is used by the integration tests.
#
# server.port stays in application.properties rather than moving here on purpose: 8081 is
# the default so that a deployment started WITHOUT this profile still binds the right port
# instead of silently falling back to Boot's 8080.

# The banner adds nothing to a log file, and the terminal dashboard owns the screen from
# ApplicationReadyEvent onwards.
spring.main.banner-mode=off

# Logging to file. FOLDER_BASE is exported by deployment/start-publicbackend.sh and is the
# deployment directory, so this resolves to the same path `just logs` tails. The `.` fallback
# keeps a jar started by hand from failing outright.
#
# Setting logging.file.name is what activates the FILE appender: logback-spring.xml imports
# Boot's file-appender.xml, which reads LOG_FILE — derived from this property.
logging.file.name=${FOLDER_BASE:.}/logs/publicbackend.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
